<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division 2 Proficiency Tracker</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen">

    <!-- Top Main Category Tabs -->
    <header class="bg-zinc-900 border-b border-orange-600/30 sticky top-0 z-50 shadow-xl">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <h1 class="text-orange-500 font-black tracking-widest text-xl uppercase">SHD // EXPERTISE LOG</h1>
                <nav class="flex space-x-1" id="main-tabs">
                    <button class="nav-tab active px-4 py-2 text-sm font-bold uppercase border-b-2 border-orange-500 text-orange-500 transition cursor-pointer" data-target="weapons">Weapons</button>
                    <button class="nav-tab px-4 py-2 text-sm font-bold uppercase text-zinc-400 hover:text-zinc-200 transition cursor-pointer" data-target="armor">Armor</button>
                    <button class="nav-tab px-4 py-2 text-sm font-bold uppercase text-zinc-400 hover:text-zinc-200 transition cursor-pointer" data-target="namedExotic">Named & Exotic</button>
                    <button class="nav-tab px-4 py-2 text-sm font-bold uppercase text-zinc-400 hover:text-zinc-200 transition cursor-pointer" data-target="skills">Skills</button>
                    <button class="nav-tab px-4 py-2 text-sm font-bold uppercase text-zinc-400 hover:text-zinc-200 transition cursor-pointer" data-target="brands">Brands</button>
                    <button class="nav-tab px-4 py-2 text-sm font-bold uppercase text-zinc-400 hover:text-zinc-200 transition cursor-pointer" data-target="gearSets">Gear Sets</button>
                </nav>
            </div>
        </div>
    </header>

    <!-- Sub-Category Filter Sub-row (Populated by app.js depending on active tab) -->
    <div class="bg-zinc-900/60 border-b border-zinc-800 py-3 shadow-md">
        <div class="max-w-7xl mx-auto px-4 flex flex-wrap gap-2" id="sub-tabs-container">
            <!-- Sub-tabs inject here -->
        </div>
    </div>

    <!-- Main Workspace Area -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Global Progress Metric Banner -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-4 mb-6 flex flex-wrap items-center justify-between gap-4 font-mono">
            <div>
                <div class="text-[10px] text-zinc-500 uppercase">Current Tracker Mode</div>
                <div class="text-sm font-bold text-orange-500 tracking-wider">LOCAL REPOSITORY STORAGE (AUTO-SAVE)</div>
            </div>
            <div class="text-right">
                <span class="text-xs text-zinc-400">Set Proficiency Rank to <b class="text-orange-400">10</b> to highlight an item card as completed.</span>
            </div>
        </div>

        <!-- Dynamic Grid Container for Item Cards -->
        <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Item cards inject here -->
        </div>
    </main>

    <!-- Initialized as a module to handle imports -->
    <script type="module" src="app.js"></script>
</body>
</html>
