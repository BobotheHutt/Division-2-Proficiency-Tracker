<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division 2 Proficiency Tracker</title>
    <!-- Tailwind CSS CDN for quick UI styling -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen">

    <!-- Primary Top Navigation Headers (Matches In-Game Groups) -->
    <header class="bg-zinc-900 border-b border-orange-600/30 sticky top-0 z-50 shadow-xl">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <h1 class="text-orange-500 font-black tracking-widest text-xl uppercase">SHD // EXPERTISE LOG</h1>
                <nav class="flex space-x-1" id="main-tabs">
                    <button class="nav-tab active px-4 py-2 text-sm font-bold uppercase border-b-2 border-orange-500 text-orange-500 transition" data-target="weapons">Weapons</button>
                    <button class="nav-tab px-4 py-2 text-sm font-bold uppercase text-zinc-400 hover:text-zinc-200 transition" data-target="armor">Armor Types</button>
                    <button class="nav-tab px-4 py-2 text-sm font-bold uppercase text-zinc-400 hover:text-zinc-200 transition" data-target="named-exotic">Named & Exotics</button>
                    <button class="nav-tab px-4 py-2 text-sm font-bold uppercase text-zinc-400 hover:text-zinc-200 transition" data-target="skills">Skills</button>
                    <button class="nav-tab px-4 py-2 text-sm font-bold uppercase text-zinc-400 hover:text-zinc-200 transition" data-target="brands">Brands</button>
                    <button class="nav-tab px-4 py-2 text-sm font-bold uppercase text-zinc-400 hover:text-zinc-200 transition" data-target="gear-sets">Gear Sets</button>
                </nav>
            </div>
        </div>
    </header>

    <!-- Sub-Category Filter Row (Generated dynamically via app.js depending on active main tab) -->
    <div class="bg-zinc-900/60 border-b border-zinc-800 py-3 shadow-md">
        <div class="max-w-7xl mx-auto px-4 flex flex-wrap gap-2" id="sub-tabs-container">
            <!-- Dynamic sub-tabs like "Assault Rifles", "SMGs", "Shotguns" inject here -->
        </div>
    </div>

    <!-- Main Grid Container for Item Cards -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Item cards inject here -->
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
