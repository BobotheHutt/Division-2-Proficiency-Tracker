<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division 2 Proficiency Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen">

    <header class="bg-zinc-900 border-b border-orange-600/30 sticky top-0 z-50 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-2">
            <h1 class="text-orange-500 font-black tracking-widest text-xl uppercase">SHD // Proficiency Log</h1>
            <nav class="flex flex-wrap gap-1" id="main-tabs"></nav>
        </div>
    </header>

    <div class="bg-zinc-900/60 border-b border-zinc-800 py-3">
        <div class="max-w-7xl mx-auto px-4 flex flex-wrap gap-2" id="sub-tabs-container"></div>
    </div>

    <main class="max-w-2xl mx-auto px-4 py-6">
        <div class="summary">
            <div class="flex justify-between font-mono text-sm mb-2">
                <span id="summary-label" class="text-orange-500 font-bold"></span>
                <span id="summary-pct" class="text-zinc-400"></span>
            </div>
            <div class="bar"><div id="summary-bar"></div></div>
        </div>

        <div class="toolbar">
            <input id="search" type="search" placeholder="Search..." autocomplete="off">
            <label class="toggle"><input type="checkbox" id="hide-done"> Hide completed</label>
            <button id="export-btn" type="button">Export</button>
            <button id="import-btn" type="button">Import</button>
            <button id="reset-btn" type="button" class="danger">Reset tab</button>
            <input id="import-input" type="file" accept="application/json,.json" hidden>
        </div>

        <p class="hint">Progress saves automatically in this browser. Set rank to <b>10</b> (or tick the box) to mark an item proficient. Use Export to back it up.</p>

        <div id="items-grid"></div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
