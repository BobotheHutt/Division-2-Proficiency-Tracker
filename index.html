<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division 2 Proficiency Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <h1>Division 2 Proficiency Tracker</h1>
            <nav class="tabs" id="main-tabs"></nav>
            <div id="account" hidden>
                <span id="sync-status"></span>
                <button id="auth-btn" type="button" class="nav-tab">Sign in with Google</button>
            </div>
        </div>
    </header>

    <div class="subbar">
        <div class="container tabs" id="sub-tabs-container"></div>
    </div>

    <main class="container narrow">
        <div class="summary">
            <div class="summary-text">
                <span id="summary-label"></span>
                <span id="summary-pct"></span>
            </div>
            <div class="bar"><div id="summary-bar"></div></div>
        </div>

        <div class="toolbar">
            <input id="search" type="search" placeholder="Search..." autocomplete="off">
            <label class="toggle"><input type="checkbox" id="hide-done"> Hide completed</label>
            <button id="export-btn" type="button">Export</button>
            <button id="import-btn" type="button">Import</button>
            <button id="reset-btn" type="button" class="danger">Reset tab</button>
            <input id="import-input" type="file" accept="application/json,.json" hidden>
        </div>

        <p class="hint">Progress saves automatically in this browser, or to your account when signed in. Set rank to <b>10</b> (or tick the box) to mark an item proficient.</p>

        <div id="items-grid"></div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
